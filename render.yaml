services:
  # Backend Web Service
  - type: web
    name: chowdhury-family-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    region: singapore # You can change this
    plan: free
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chowdhury-family-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://chowdhury-family-frontend.onrender.com" # Update this after frontend deployment

  # Frontend Static Site
  - type: static
    name: chowdhury-family-frontend
    env: static
    buildCommand: "npm install && npm run build"
    publishDir: "dist"
    region: singapore
    plan: free
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://chowdhury-family-backend.onrender.com/api/v1" # Update this to your backend URL

    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"

databases:
  - name: chowdhury-family-db
    region: singapore
    plan: free
